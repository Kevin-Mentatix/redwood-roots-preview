# Decap CMS config — the /admin/ blog editor.
#
# AUTH SETUP (one-time, by Kevin — see README "Client self-service"):
#   Hosting on Netlify → uncomment the git-gateway backend below, enable Identity + Git Gateway,
#   and email-invite the client. Otherwise use the github backend with an OAuth app.
backend:
  name: github
  repo: CHANGE-ME/redwood-roots # TODO: set to the real GitHub owner/repo after pushing
  branch: main
# backend:
#   name: git-gateway
#   branch: main

site_url: https://www.redwoodrootsfamily.com
logo_url: https://www.redwoodrootsfamily.com/assets/img/apple-touch-icon.png

media_folder: "static/img/blog"
public_folder: "/assets/img/blog"

collections:
  - name: blog
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Shown as the headline and browser title" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Search description", name: "description", widget: "text", hint: "1–2 sentences, under 155 characters — this is what Google shows" }
      - { label: "Cover image (optional)", name: "cover", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
